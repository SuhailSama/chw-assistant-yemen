# Builds the PWA and publishes it to GitHub Pages (free for public repos).
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
#
# The two Supabase values below are public client identifiers, not secrets:
# they ship in the JS bundle to every browser. Data access is enforced by
# row-level security and the edge functions. No repository secrets needed.

name: Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build Frontend
        working-directory: ./app
        run: |
          npm ci
          npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_SUPABASE_URL: https://ovubfucmswpauuybbcif.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_Q62pevdn6MwlZQ8BuplWMQ_sgy-tKz0

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./app/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
